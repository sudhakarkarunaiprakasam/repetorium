[project]
name = "repetorium"
version = "1.0.0"
description = "An offline-first tutor for user-provided knowledge libraries"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = [
    "PySide6>=6.8",
    "PyYAML>=6.0",
    "platformdirs>=4.0",
]

[project.scripts]
repetorium = "repetorium.app:main"

[project.urls]
Homepage = "https://github.com/sudhakarkarunaiprakasam/repetorium"
Repository = "https://github.com/sudhakarkarunaiprakasam/repetorium"
Issues = "https://github.com/sudhakarkarunaiprakasam/repetorium/issues"

[dependency-groups]
build = [
    "pip>=24.0",
]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repetorium"]
exclude = ["**/*.exe", "**/pysidedeploy.spec"]

[tool.hatch.build.targets.sdist]
include = [
    "src/repetorium",
    "scripts/build.py",
    "scripts/generate_icons.py",
    "README.md",
    "LICENSE",
    "KNOWLEDGE_LIBRARY.md",
    "docs/BUILDING.md",
    "docs/LEARNING_SOFTWARE.md",
    "docs/LEARNING_DESIGN.md",
    "pyproject.toml",
    "uv.lock",
]
exclude = ["**/*.exe", "**/pysidedeploy.spec"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
